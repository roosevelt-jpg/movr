version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: movr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-movr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-movr_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - movr_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-movr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: movr_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - movr_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: movr-backend:latest
    container_name: movr_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - movr_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

  web:
    image: movr-web:latest
    container_name: movr_web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - movr_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  movr_network:
    driver: bridge
