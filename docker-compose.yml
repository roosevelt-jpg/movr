version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: movr_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: movr
      POSTGRES_PASSWORD: movr
      POSTGRES_DB: movr_db
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - movr_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movr"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: movr_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ""
    volumes:
      - redis_data:/data
    networks:
      - movr_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer - Database Management UI (optional)
  adminer:
    image: adminer:latest
    container_name: movr_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - movr_network

  # Redis Commander - Redis Management UI (optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: movr_redis_commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - movr_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  movr_network:
    driver: bridge
